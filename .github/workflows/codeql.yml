# CodeQL baseline — thin caller of quality-zero-platform's reusable workflow.
#
# Replaces the previous in-repo advanced wrapper (javascript-typescript,
# security-extended) with the platform-managed analysis: query suite raised
# to security-and-quality, languages resolved from the repo's QZP profile,
# fail-closed unless the analysis succeeds, and every action the wrapper
# runs is SHA-pinned by the platform. The platform is checked out at this
# file's own workflow SHA (job.workflow_sha), so a PR head can never pick
# or drift from the scripts it runs.
#
# The Kotlin/Java sources are not part of this analysis (same as before
# this change); adding the java language is tracked as a follow-up.
name: CodeQL

permissions:
  actions: read
  contents: read
  security-events: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: Prekzursil/quality-zero-platform/.github/workflows/reusable-codeql.yml@cc4c6ec12c2b1f204f79414a717e82472e98cb58
    with:
      repo_slug: ${{ github.repository }}
      event_name: ${{ github.event_name }}
      sha: ${{ github.event.pull_request.head.sha || github.sha }}
