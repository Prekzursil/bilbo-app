# Advanced CodeQL analysis (fleet standard 2026-11) — see the PR description
# for the full rationale. Renamed from codeql.yml: that workflow entity had a
# failing/disabled history and refused to start (0s "workflow file issue"
# failures with zero jobs and no annotations — runs 41885342968/41886098238).
name: CodeQL Security Analysis

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "29 4 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 17
        if: ${{ matrix.language == 'java-kotlin' }}
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        if: ${{ matrix.language == 'java-kotlin' }}
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Grant execute permission for gradlew
        if: ${{ matrix.language == 'java-kotlin' }}
        run: chmod +x gradlew

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Both suites per the fleet CODEQL DECISION — strictly subsumes the
          # default suite and the extended suite.
          queries: security-extended,security-and-quality

      # Compile only (not `gradlew build`): the full build also runs lint,
      # which Android CI tolerates only as continue-on-error.
      - name: Build Kotlin (shared + androidApp)
        if: ${{ matrix.language == 'java-kotlin' }}
        run: ./gradlew :shared:assemble :androidApp:assemblePlaystoreDebug --no-daemon

      - name: Perform CodeQL Analysis (write SARIF, defer upload)
        if: ${{ matrix.language == 'java-kotlin' }}
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:java-kotlin"
          output: ../sarif-jk
          upload: false

      # OWNER-DIRECTED GENERATED-CODE FILTER (2026-11-17, SwitchAI
      # precedent): the Kotlin Compose compiler synthesizes `$stable` fields
      # on stability-inferred classes; the generated subclass `$stable`
      # "masks" the generated superclass `$stable`, producing two
      # java/field-masks-super-field alerts with NO source construct behind
      # them (verified: grep finds no "stable" in either file):
      #   alert #32 androidApp/src/main/kotlin/dev/bilbo/app/ui/screen/ChallengeScreen.kt:1
      #   alert #33 androidApp/src/main/kotlin/dev/bilbo/app/ui/screen/CircleScreen.kt:1
      # All five documented CodeQL exclusion mechanisms fail on a traced
      # java-kotlin database (details in
      # .github/scripts/filter-generated-sarif.js). The filter is
      # deliberately narrow — rule java/field-masks-super-field AND a
      # message naming the compiler-synthesized `$stable` field ONLY — real
      # Kotlin findings keep flowing (canary: the script logs kept/removed
      # counts; a kept count of 0 means the pipeline is broken, fix the
      # pipeline, never widen the filter). No API dismissals: the next
      # same-key SARIF upload closes the two alerts via normal code-scanning
      # reconciliation.
      - name: Filter Compose-compiler-generated $stable findings out of SARIF
        if: ${{ matrix.language == 'java-kotlin' }}
        run: node .github/scripts/filter-generated-sarif.js ../sarif-jk

      - name: Upload filtered SARIF to code scanning
        if: ${{ matrix.language == 'java-kotlin' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ../sarif-jk
          category: "/language:java-kotlin"

      - name: Perform CodeQL Analysis
        if: ${{ matrix.language != 'java-kotlin' }}
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"

  # Swift analysis: separate job (jobs.<id>.if cannot reference the matrix
  # context) running ONLY on the weekly schedule and manual dispatch. The
  # Swift extractor must trace a full xcodebuild (Gradle XCFramework +
  # XcodeGen project generation first — ~40+ min of macOS runner time), and
  # macOS minutes bill at 10x: on every push/PR that would exhaust the
  # account's macOS quota and stall ALL required checks fleet-wide. Weekly
  # keeps the language covered without that operational failure mode.
  analyze-swift:
    name: Analyze (swift)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    # OWNER-DIRECTED (2026-11-17): macos-14 instead of macos-15. The
    # macos-15 image drifts — intermittently ships Xcode 16.1 WITHOUT the
    # iOS Simulator platform/runtime (a GitHub image regression), which
    # killed every traced swift analysis so far (runs 41892925010,
    # 41915307478, 41920185244, 41930620068, and the 2026-11-16 scheduled
    # run 43871596027: "Found no destinations for the scheme 'iosApp'",
    # exit 70, even with the SDK-based no-destination build). macos-14
    # ships stable Xcode 15.x images with the simulator platform intact.
    runs-on: macos-14
    timeout-minutes: 120

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # brew BEFORE the CodeQL tracer wraps the environment: with init first,
      # brew runs in a Rosetta 2 context and dies with 'Cannot install under
      # Rosetta 2 in ARM default prefix (/opt/homebrew)' (run 41892925010).
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: swift
          build-mode: manual
          queries: security-extended,security-and-quality

      # The app links the Kotlin shared framework: reproduce the iOS CI build
      # exactly (framework -> xcodegen -> xcodebuild, signing off) with the
      # CodeQL tracer wrapping the xcodebuild compilation.
      - name: Build shared XCFramework for Swift analysis
        run: ./gradlew :shared:assembleSharedDebugXCFramework --no-daemon

      # Belt-and-braces Xcode selection (macos-14 ships stable Xcode 15.x,
      # but the same probe guards against any future image drift): probe
      # each installed Xcode for a usable iphonesimulator SDK and select the
      # first one that has it, failing loudly if none does.
      - name: Select an Xcode with the iOS Simulator platform
        run: |
          set -euo pipefail
          pick=""
          for xc in /Applications/Xcode*.app; do
            [ -d "$xc" ] || continue
            sudo xcode-select -s "$xc" 2>/dev/null || continue
            if xcrun --sdk iphonesimulator --show-sdk-version >/dev/null 2>&1; then
              pick="$xc"; break
            fi
          done
          if [ -z "$pick" ]; then
            echo "::error::no installed Xcode has the iOS Simulator SDK"
            ls /Applications/ | grep -i xcode || true
            exit 1
          fi
          echo "using $(basename "$pick") (simulator SDK $(xcrun --sdk iphonesimulator --show-sdk-version))"

      - name: Generate iosApp.xcodeproj
        working-directory: iosApp
        run: xcodegen generate

      # SDK-based build (no -destination): destination resolution needs the
      # simulator RUNTIME, which the drifting macos-15 image intermittently
      # lacks (4 dispatch attempts: runs 41892925010, 41915307478, 41920185244,
      # 41930620068); the SDK itself is always present (xcrun probe passes).
      - name: Build iOS app (traced by CodeQL)
        working-directory: iosApp
        run: |
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:swift"

  # Fail-closed gate: the branch-protection required check `CodeQL` must never
  # be satisfied by a skipped, cancelled, failed, or unreported analysis.
  codeql-gate:
    name: CodeQL
    if: ${{ always() }}
    needs: [analyze, analyze-swift]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every analysis for this trigger passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          [ -n "$RESULTS" ] || { echo "::error title=CodeQL gate::no analysis results to gate on"; exit 1; }
          # push/PR: the always-on matrix must all succeed; swift is skipped
          # by design. schedule/dispatch: the FULL matrix, swift included.
          case "$EVENT" in
            schedule|workflow_dispatch)
              for r in $RESULTS; do
                [ "$r" = success ] || { echo "::error title=CodeQL gate::an analysis ended with '$r' (all: $RESULTS) on a $EVENT run"; exit 1; }
              done
              ;;
            *)
              for r in $RESULTS; do
                [ "$r" = success ] || [ "$r" = skipped ] || { echo "::error title=CodeQL gate::an analysis ended with '$r' (all: $RESULTS)"; exit 1; }
              done
              ;;
          esac
          echo "CodeQL analyses passed for this trigger: $RESULTS"
