name: iOS CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-kotlin-framework:
    name: Build Kotlin Shared XCFramework
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Shared XCFramework (Debug)
        run: ./gradlew :shared:assembleSharedDebugXCFramework --no-daemon

      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Shared-debug-xcframework
          path: shared/build/XCFrameworks/debug/
          retention-days: 7

  swiftlint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        working-directory: iosApp
        run: swiftlint --strict
        continue-on-error: true

  build-ios-app:
    name: Build iOS App
    runs-on: macos-15
    timeout-minutes: 60
    needs: [build-kotlin-framework]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Shared XCFramework
        run: ./gradlew :shared:assembleSharedDebugXCFramework --no-daemon

      # The macos-15 image drifts: some runners ship Xcode 16.1 WITHOUT the
      # iOS Simulator platform installed, and xcodebuild then fails every
      # destination (concrete 'iPhone 16' and generic alike) with exit 70
      # ('iOS 18.1 is not installed'). Prefer the pinned 16.1, but fall back
      # to any installed Xcode that actually has the iphonesimulator SDK.
      - name: Select an Xcode with the iOS Simulator platform
        run: |
          set -euo pipefail
          pick=""
          for xc in /Applications/Xcode_16.1.app /Applications/Xcode*.app; do
            [ -d "$xc" ] || continue
            sudo xcode-select -s "$xc" 2>/dev/null || continue
            if xcrun --sdk iphonesimulator --show-sdk-version >/dev/null 2>&1; then
              pick="$xc"; break
            fi
          done
          if [ -z "$pick" ]; then
            echo "::error::no installed Xcode has the iOS Simulator SDK"
            ls /Applications/ | grep -i xcode || true
            exit 1
          fi
          echo "using $(basename "$pick") (simulator SDK $(xcrun --sdk iphonesimulator --show-sdk-version))"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate iosApp.xcodeproj
        working-directory: iosApp
        run: xcodegen generate

      - name: Build iOS app (simulator)
        working-directory: iosApp
        run: |
          set -o pipefail
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build \
            | xcpretty

      - name: Package unsigned iOS .app bundle
        working-directory: iosApp
        run: |
          set -e
          APP_PATH=$(find build/Build/Products -maxdepth 4 -type d -name 'iosApp.app' | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::iosApp.app bundle not found after build"
            find build -maxdepth 4 -type d || true
            exit 1
          fi
          mkdir -p release-artifacts
          # Preserve symlinks inside the .app bundle with -y
          (cd "$(dirname "$APP_PATH")" && zip -ry "../../../../release-artifacts/Bilbo-iOS-unsigned.zip" "$(basename "$APP_PATH")")
          ls -la release-artifacts/

      - name: Upload iOS app artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Bilbo-iOS-unsigned
          path: iosApp/release-artifacts/Bilbo-iOS-unsigned.zip
          retention-days: 14
          if-no-files-found: warn

      # Unit tests are disabled until an actual test target is added to project.yml.
      # The CI just needs to produce a valid unsigned .app artifact for the release.

  attach-ios-release-artifact:
    name: Attach iOS build to GitHub Release
    runs-on: ubuntu-latest
    needs: [build-ios-app]
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Download iOS app zip
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Bilbo-iOS-unsigned
          path: release-artifacts/

      - name: List downloaded artifacts
        run: ls -la release-artifacts/ || true

      - name: Attach iOS zip to release ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f release-artifacts/Bilbo-iOS-unsigned.zip ]; then
            gh release upload "${{ github.ref_name }}" \
              release-artifacts/Bilbo-iOS-unsigned.zip \
              --clobber
          else
            echo "::warning::iOS zip artifact was not produced; skipping release upload."
          fi
